<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>总装车间 - 实时监控</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css"> <!-- 更新 CSS 路徑 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <header>
        <h1>新能源汽车生产车间</h1>
        <button id="theme-toggle-btn" title="切换主题">
            <i class="fas fa-sun"></i>
        </button>
    </header>
    <nav>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <ul id="nav-menu"><li><a href="/html/index.html" id="nav-index">首页概览</a></li><li><a href="/html/battery.html" id="nav-battery">电池车间</a></li><li><a href="/html/welding.html" id="nav-welding">焊接车间</a></li><li><a href="/html/assembly.html" id="nav-assembly">总装车间</a></li><li><a href="/html/testing.html" id="nav-testing">检测车间</a></li></ul>
    </nav>
    <main>
        <div class="main-title-container">
            <h2>总装车间 - 数据监控</h2>
            <button id="export-data-button" class="export-button-main" title="导出当前页面数据"><i class="bi bi-download"></i> 导出数据</button>
        </div>
         <div class="workshop-layout">
             <div class="data-card gauge-card" data-key="zone_temp" data-status="idle">
                 <div class="data-card-header"> <i class="bi bi-thermometer-sun data-card-icon"></i> <span class="data-card-label">作业区温度</span> <span class="data-card-status-indicator">--</span> </div>
                 <div class="data-card-content gauge-chart-container"> <canvas id="chart_zone_temp"></canvas> <span class="gauge-value-text" id="value_zone_temp">-</span> </div>
             </div>
             <div class="data-card gauge-card" data-key="coolant_level" data-status="idle">
                 <div class="data-card-header"> <i class="bi bi-droplet-half data-card-icon"></i> <span class="data-card-label">冷却液液位</span> <span class="data-card-status-indicator">--</span> </div>
                 <div class="data-card-content gauge-chart-container"> <canvas id="chart_coolant_level"></canvas> <span class="gauge-value-text" id="value_coolant_level">-</span> </div>
             </div>
             <div class="data-card gauge-card" data-key="brake_fluid_level" data-status="idle">
                 <div class="data-card-header"> <i class="bi bi-droplet-fill data-card-icon"></i> <span class="data-card-label">制动液液位</span> <span class="data-card-status-indicator">--</span> </div>
                 <div class="data-card-content gauge-chart-container"> <canvas id="chart_brake_fluid_level"></canvas> <span class="gauge-value-text" id="value_brake_fluid_level">-</span> </div>
             </div>

             <div class="data-card chart-card" data-key="bolt_torque" data-status="idle">
                 <div class="data-card-header"> <i class="bi bi-tools data-card-icon"></i> <span class="data-card-label">关键螺栓扭矩 (Nm) - 趋势</span> <span class="data-card-status-indicator">--</span> </div>
                 <div class="data-card-content line-chart-container"> <canvas id="chart_line_bolt_torque"></canvas> </div>
             </div>

             <div class="data-card" data-key="brightness_lux" data-status="idle">
                  <div class="data-card-header"> <i class="bi bi-brightness-high-fill data-card-icon"></i> <span class="data-card-label">照明亮度</span> <span class="data-card-status-indicator">--</span> </div>
                  <div class="data-card-content"> <span class="data-card-value" id="brightness_lux">-</span> </div>
             </div>
             <div class="data-card" data-key="torque_result" data-status="idle">
                  <div class="data-card-header"> <i class="bi bi-check2-square data-card-icon"></i> <span class="data-card-label">拧紧结果</span> <span class="data-card-status-indicator">--</span> </div>
                  <div class="data-card-content"> <span class="data-card-value" id="torque_result">-</span> </div>
             </div>
             <div class="data-card" data-key="battery_sensor" data-status="idle">
                  <div class="data-card-header"> <i class="bi bi-battery-full data-card-icon"></i> <span class="data-card-label">电池包到位</span> <span class="data-card-status-indicator">--</span> </div>
                  <div class="data-card-content"> <span class="data-card-value" id="battery_sensor">-</span> </div>
             </div>
             <div class="data-card" data-key="agv_status" data-status="idle">
                  <div class="data-card-header"> <i class="bi bi-truck-front-fill data-card-icon"></i> <span class="data-card-label">AGV小车状态</span> <span class="data-card-status-indicator">--</span> </div>
                  <div class="data-card-content"> <span class="data-card-value" id="agv_status">-</span> </div>
             </div>
             <div class="data-card" data-key="call_button_status" data-status="idle">
                 <div class="data-card-header"> <i class="bi bi-bell-fill data-card-icon"></i> <span class="data-card-label">物料呼叫按钮</span> <span class="data-card-status-indicator">--</span> </div>
                 <div class="data-card-content"> <span class="data-card-value" id="call_button_status">-</span> </div>
             </div>
        </div>
        <div id="last-updated">最后更新时间: -</div>
    </main>
    <footer><p>&copy; 2025 NEV Workshop Monitor (v5 - Polished UI). All Rights Reserved.</p></footer>
    <button id="debug-button">手动获取数据 (Debug)</button> <pre id="debug-output"></pre>
    <script src="/js/script.js"></script> <!-- 更新 JS 路徑 -->
    <script src="/js/theme.js"></script> <!-- Ensure theme.js is included -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // initializeTheme(); // REMOVED: Theme is initialized by theme.js
            setActiveNav('assembly');
            initializeGaugeChart('zone_temp', 15, 35, '°C');
            initializeGaugeChart('coolant_level', 80, 100, '%');
            initializeGaugeChart('brake_fluid_level', 90, 100, '%');
            initializeLineChart('bolt_torque', '螺栓扭矩', 'Nm');
            const lineKeys = ['bolt_torque'];
            startDataFetching('assembly', lineKeys);
            setupDebugButton('assembly', lineKeys);
            setupExportButton('assembly');
        });
    </script>
</body>
</html>
