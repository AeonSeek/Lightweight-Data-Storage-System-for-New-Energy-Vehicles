<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工信息管理</title>
    <link rel="stylesheet" href="../css/style.css"> <!-- Common styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" /> <!-- For icons -->
    <style>
        /* Keep modal-specific styles separate for clarity, use theme variables */
        .modal {
            display: none;
            position: fixed;
            z-index: 1050;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* Darker overlay */
        }
        .modal-content {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            margin: 8% auto; /* Adjust vertical margin */
            padding: 30px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 550px;
            box-shadow: var(--shadow-lg);
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1.5em;
            color: var(--text-primary);
        }
        .close-button {
            background: none;
            border: none;
            font-size: 1.8em;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0 5px;
        }
        .close-button:hover {
            color: var(--text-primary);
        }

        /* General form styles using theme vars */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%; /* Use 100% width */
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--shadow-color);
        }

        /* Table styles leveraging theme */
        .content-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: var(--shadow-md);
            background-color: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden; /* Ensures border-radius is applied to corners */
        }
        .content-table thead tr {
            background-color: var(--accent-primary);
            color: #ffffff;
            text-align: left;
            font-weight: bold;
        }
        .content-table th,
        .content-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }
        .content-table tbody tr {
            transition: background-color 0.15s ease;
        }
        .content-table tbody tr:nth-of-type(even) {
            background-color: var(--bg-primary); /* Subtle striping */
        }
        .content-table tbody tr:hover {
            background-color: var(--bg-tertiary);
        }
        .content-table tbody tr:last-of-type td {
            border-bottom: none; /* No border for the last row */
        }
        .content-table td .action-button,
        .content-table td .action-button-secondary,
        .content-table td .action-button-danger {
            padding: 5px 10px; /* Smaller buttons for table actions */
            font-size: 0.85em;
        }

        /* Button styles based on theme */
        .action-button,
        .action-button-secondary,
        .action-button-danger {
            display: inline-flex; /* Align icon and text */
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            text-decoration: none; /* For link buttons */
            transition: background-color 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
            box-shadow: var(--shadow-sm);
        }
        .action-button:hover,
        .action-button-secondary:hover,
        .action-button-danger:hover {
            opacity: 0.9;
        }
         .action-button:active,
        .action-button-secondary:active,
        .action-button-danger:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        .action-button { /* Primary button style */
            background-color: var(--accent-primary);
            color: white;
        }

        .action-button-secondary { /* Secondary/Edit button */
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .action-button-secondary:hover {
            background-color: var(--border-color);
        }

        .action-button-danger { /* Delete button */
            background-color: var(--status-nok-border);
            color: white;
        }
         .action-button-danger:hover {
            background-color: #c82333; /* Darker red on hover */
        }

        /* Header button styling if needed, might be covered by global style.css */
        .header-button {
            color: var(--text-primary);
            text-decoration: none;
            background: none;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.9em;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px; /* Add some spacing */
        }
        .header-button:hover {
            background-color: var(--bg-tertiary);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .header-button i {
            font-size: 1.1em;
        }

    </style>
</head>
<body>
    <header class="app-header">
        <h1>员工信息管理</h1>
        <div class="header-actions">
            <button id="theme-toggle-btn" title="切换主题"><i class="fas fa-sun"></i></button>
            <a href="admin_dashboard.html" class="header-button">返回仪表盘</a>
            <button id="logout-button" class="header-button"><i class="fas fa-sign-out-alt"></i> 登出</button>
        </div>
    </header>

    <main class="main-content-wrapper" style="padding: 30px; max-width: 1100px; margin: 30px auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">员工列表</h2>
            <button id="addEmployeeBtn" class="action-button"><i class="fas fa-plus"></i> 添加新员工</button>
        </div>

        <table class="content-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- Employee rows will be inserted here by JavaScript -->
                <tr><td colspan="6" style="text-align: center; padding: 20px;">正在加载...</td></tr>
            </tbody>
        </table>

        <!-- Pagination Controls Container -->
        <div id="paginationControls" style="margin-top: 20px; text-align: center;">
            <!-- Pagination will be rendered here by JavaScript -->
        </div>
    </main>

    <!-- Add/Edit Employee Modal -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加员工</h3>
                <button class="close-button" id="closeModalBtn" title="关闭">&times;</button>
            </div>
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                <div class="form-group">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">邮箱:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">密码 (编辑时留空则不修改):</label>
                    <input type="password" id="password" name="password">
                    <!-- Consider adding password strength indicator or requirements info -->
                </div>
                <div class="form-group">
                    <label for="role">角色:</label>
                    <select id="role" name="role">
                        <option value="操作员">操作员</option>
                        <option value="管理员">管理员</option>
                        <!-- Add other roles from your system if applicable -->
                    </select>
                </div>
                <div style="text-align: right; margin-top: 25px;">
                    <button type="button" class="action-button-secondary" id="cancelModalBtn" style="margin-right: 10px;">取消</button>
                    <button type="submit" class="action-button">保存</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 新能源汽车数据监控系统</p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/employee_management.js"></script>
    <script>
        // Add event listener for the new cancel button in the modal
        document.addEventListener('DOMContentLoaded', () => {
            const cancelModalBtn = document.getElementById('cancelModalBtn');
            const employeeModal = document.getElementById('employeeModal');
            if (cancelModalBtn) {
                cancelModalBtn.addEventListener('click', () => {
                     if(employeeModal) employeeModal.style.display = 'none';
                });
            }
        });
    </script>
</body>
</html>
